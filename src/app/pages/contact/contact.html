<app-page-layout title="Contact" i18n-title="Contact page title@@contactTitle" [hasBreadcrumb]="true">
  <ng-container breadcrumb>
    <span><a routerLink="/" i18n="Breadcrumb home@@breadcrumbHome">Home</a></span>
    <span i18n="Breadcrumb contact@@breadcrumbContact">Contact</span>
  </ng-container>

  <p i18n="Contact page description@@contactDescription">Get in touch with us.</p>
</app-page-layout>
