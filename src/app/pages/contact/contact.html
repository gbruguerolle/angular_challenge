<app-page [title]="'CONTACT.TITLE' | translate" [hasBreadcrumb]="true">
  <ng-container breadcrumb>
    <span><a routerLink="/">{{ 'BREADCRUMB.HOME' | translate }}</a></span>
    <span>{{ 'BREADCRUMB.CONTACT' | translate }}</span>
  </ng-container>

  <p>{{ 'CONTACT.DESCRIPTION' | translate }}</p>

  <form (submit)="onSubmit($event)" novalidate>
    <app-input
      [field]="fields.email.field"
      [controlName]="fields.email.controlName"
      [inputType]="fields.email.inputType"
      [label]="fields.email.label()"
      [placeholder]="fields.email.placeholder()"
      [isSubmitted]="isSubmitted()"
    />
    <app-input
      [field]="fields.title.field"
      [controlName]="fields.title.controlName"
      [inputType]="fields.title.inputType"
      [label]="fields.title.label()"
      [placeholder]="fields.title.placeholder()"
      [isSubmitted]="isSubmitted()"
    />
    <app-input
      [field]="fields.message.field"
      [controlName]="fields.message.controlName"
      [inputType]="fields.message.inputType"
      [label]="fields.message.label()"
      [placeholder]="fields.message.placeholder()"
      [isSubmitted]="isSubmitted()"
    />
    <button type="submit">{{ 'CONTACT.FORM.SUBMIT' | translate }}</button>
  </form>
</app-page>
