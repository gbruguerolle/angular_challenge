<div
  [ngStyle]="!isImageLoaded ? { 'background-image': 'url(' + imageUrlSmall() + ')' } : {}"
  [ngClass]="{ placeholder: true, 'placeholder-loaded': isImageLoaded }"
>
  <img
    src="{{ imageUrl() }}"
    alt="{{ imageName() }}"
    (load)="onImageLoad()"
    [ngClass]="{ image: true, 'image-loaded': isImageLoaded }"
    loading="eager"
    class="image"
  />
</div>
