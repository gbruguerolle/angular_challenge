<header>
    <nav>
        <a [routerLink]="routes.home | toPath" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">{{ 'NAV.HOME' | translate }}</a>
        <a [routerLink]="routes.contact | toPath" routerLinkActive="active">{{ 'NAV.CONTACT' | translate }}</a>
    </nav>

    <ul class="lang-switcher">
        @for (lang of languages; track lang) {
            <li [class.active]="lang === currentLang()" (click)="setLang(lang)">{{ lang }}</li>
        }
    </ul>
</header>
